---
- name: Harden the openSUSE host
  hosts: hardened_hosts
  become: true
  gather_facts: true
  # Scope the short role names below to this collection so they resolve to
  # acidnetworks.hardening_suse.* (installed) or roles/ (standalone dev).
  collections:
    - acidnetworks.hardening_suse
  pre_tasks:
    - name: Arm the dead-man's-switch before any cutover
      ansible.builtin.include_tasks: tasks/arm_rollback.yml
      when: harden_safe_rollback | bool
  tasks:
    - name: Apply hardening roles (disarm always runs if we stay reachable)
      block:
        # OS identity (hostname/locale) and auto-updates live in acidnetworks.base_suse
        # (time_locale enables chronyd; updates does zypper patching). time_sync here
        # owns chrony.conf. Consumers with their own signed-NTP set harden_manage_time_sync false.
        - name: Apply time_sync role
          ansible.builtin.import_role: { name: time_sync }
          when: harden_manage_time_sync | default(true) | bool
        - name: Apply accounts role
          ansible.builtin.import_role: { name: accounts }

        - name: Apply ssh_hardening role
          ansible.builtin.import_role: { name: ssh_hardening }
        - name: Verify connectivity after ssh_hardening
          ansible.builtin.include_tasks: tasks/verify_conn.yml

        - name: Apply crowdsec role
          ansible.builtin.import_role: { name: crowdsec }
        - name: Apply fail2ban role
          ansible.builtin.import_role: { name: fail2ban }
        - name: Apply sysctl_hardening role
          ansible.builtin.import_role: { name: sysctl_hardening }
        - name: Apply auditd role
          ansible.builtin.import_role: { name: auditd }
        - name: Apply aide role
          ansible.builtin.import_role: { name: aide }
        - name: Apply lynis role
          ansible.builtin.import_role: { name: lynis }
        - name: Apply hardening_misc role
          ansible.builtin.import_role: { name: hardening_misc }
        - name: Apply rootkit_scanners role
          ansible.builtin.import_role: { name: rootkit_scanners }
        - name: Apply security_reporting role
          ansible.builtin.import_role: { name: security_reporting }

        - name: Apply ssh_2fa role
          ansible.builtin.import_role: { name: ssh_2fa }
        - name: Verify connectivity after ssh_2fa
          ansible.builtin.include_tasks: tasks/verify_conn.yml
      always:
        - name: Disarm the dead-man's-switch
          ansible.builtin.include_tasks: tasks/disarm_rollback.yml
          when: harden_safe_rollback | bool
