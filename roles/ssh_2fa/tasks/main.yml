---
# openSUSE ships the module as google-authenticator-libpam (PackageHub — must be enabled/registered on the host).
- name: Install the TOTP PAM module
  community.general.zypper:
    name: google-authenticator-libpam
    state: present
  when: ssh_2fa_totp_enabled | bool

- name: Back up /etc/pam.d/sshd once
  ansible.builtin.copy:
    src: /etc/pam.d/sshd
    dest: /etc/pam.d/sshd.orig
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "0644"
  when: ssh_2fa_totp_enabled | bool

# SUSE writes 'auth include common-auth' (not Debian's '@include common-auth'), so the Debian regexp matches
# nothing and password auth silently stays ON. We comment the line here in sshd's own PAM file — NOT in the
# shared common-auth, which pam-config can clobber — to enforce the TOTP-only kbd-interactive assumption.
- name: Disable password (common-auth) in the sshd PAM stack — TOTP-only kbd-interactive
  ansible.builtin.replace:
    path: /etc/pam.d/sshd
    regexp: '^auth\s+include\s+common-auth$'
    replace: '#auth include common-auth  # disabled by ssh_2fa'
  when: ssh_2fa_totp_enabled | bool
  notify: Reload ssh

# Adding pam_google_authenticator.so straight into /etc/pam.d/sshd is the SUSE-correct spot (leaves the
# pam-config-managed common-* stack alone); the line itself is identical to Debian.
- name: Require TOTP for keyboard-interactive logins
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    regexp: '^auth\s+required\s+pam_google_authenticator\.so'
    line: "auth required pam_google_authenticator.so{{ ' nullok' if ssh_2fa_totp_nullok else '' }}"
    insertafter: BOF
    firstmatch: true
  when: ssh_2fa_totp_enabled | bool
  notify: Reload ssh

- name: Deploy the 2FA sshd drop-in
  ansible.builtin.template:
    src: 20-2fa.conf.j2
    dest: /etc/ssh/sshd_config.d/20-2fa.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Reload ssh
