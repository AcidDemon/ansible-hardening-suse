---
# Self-healing lockout guard. AllowGroups (deployed below) refuses SSH to anyone not in
# ssh_allow_groups. BEFORE that goes live, guarantee the admin / deploy / connecting users
# are in the first allow-group. Only touches users that already EXIST — creating login users
# (with keys) is base_users' job, not hardening's, so a missing user is skipped, not created.
- name: Ensure the SSH allow-groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ ssh_allow_groups }}"

- name: Enumerate local users
  ansible.builtin.getent:
    database: passwd

- name: Add admin/deploy/connecting users to an allowed SSH group (prevent lockout)
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ ssh_allow_groups[0] }}"
    append: true
  loop: "{{ [admin_user | default(''), deploy_user | default(''), ansible_user | default('')] | select('string') | reject('equalto', '') | unique }}"
  when: item in ansible_facts.getent_passwd

# Final safety net: after self-healing, the connecting user MUST be in an allowed group —
# fail loud (before the cutover) if for some reason it still isn't. Rollback is the backstop.
- name: Resolve the connecting user's groups
  ansible.builtin.command: "id -nG {{ ansible_user }}"
  register: ssh_login_user_groups
  changed_when: false
  when: ansible_user is defined

- name: Assert the connecting user stays in an allowed group after hardening
  ansible.builtin.assert:
    that: ssh_allow_groups | intersect(ssh_login_user_groups.stdout.split()) | length > 0
    fail_msg: >-
      SSH user '{{ ansible_user }}' is in groups [{{ ssh_login_user_groups.stdout }}],
      but ssh_allow_groups is [{{ ssh_allow_groups | join(' ') }}] — applying AllowGroups
      would lock you out. Add the user to one of those groups or adjust ssh_allow_groups.
    quiet: true
  when: ansible_user is defined

# SUSE: stock /etc/ssh/sshd_config may not carry the sshd_config.d Include, and sshd is
# first-match-wins — without this the drop-in below is parsed but its keywords are overridden
# by whatever the base config already set. Anchor the Include at BOF so the drop-in wins.
- name: Ensure sshd reads the drop-in directory (Include near BOF)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    # Anchor the exact Include so a pre-existing one is matched (not duplicated —
    # a second glob would re-parse the drop-in twice, redefining Subsystem sftp).
    regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf\s*$'
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    firstmatch: true
    validate: "/usr/sbin/sshd -t -f %s"

- name: Deploy the SSH hardening drop-in
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Reload ssh

- name: Detect weak DH moduli (< 3072 bit)
  ansible.builtin.command: awk 'NF==7 && $5 < 3071' /etc/ssh/moduli
  register: ssh_weak_moduli
  changed_when: false
  when: ssh_prune_moduli | bool

- name: Prune weak DH moduli (< 3072 bit)
  ansible.builtin.shell: >-
    set -o errexit;
    awk 'NF!=7 || $5 >= 3071' /etc/ssh/moduli > /etc/ssh/moduli.tmp &&
    mv /etc/ssh/moduli.tmp /etc/ssh/moduli
  when:
    - ssh_prune_moduli | bool
    - ssh_weak_moduli.stdout | length > 0
  changed_when: true
  notify: Reload ssh

- name: Ensure /etc/ssh/moduli has stock ownership and mode
  ansible.builtin.file:
    path: /etc/ssh/moduli
    owner: root
    group: root
    mode: "0644"
  when: ssh_prune_moduli | bool

- name: Remove the ECDSA host key (prefer Ed25519 + RSA)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ssh/ssh_host_ecdsa_key
    - /etc/ssh/ssh_host_ecdsa_key.pub
  notify: Reload ssh
